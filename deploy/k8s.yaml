# Sentinel-X production deployment blueprint.
#
# Assumes: image pushed to a registry, a `sentinel-x-secrets` Secret created
# out-of-band (sealed-secrets / ExternalSecrets backed by Vault or AWS
# Secrets Manager — never `kubectl create secret` from a laptop with prod
# values), and MySQL reachable in-cluster or via a managed endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-x
  labels:
    app: sentinel-x
spec:
  # Two replicas minimum: one pod is not an availability strategy. The
  # in-memory ingestion rate limiter is per-pod — fleet-wide fairness moves
  # to Redis or the gateway when replicas scale beyond a handful.
  replicas: 2
  selector:
    matchLabels:
      app: sentinel-x
  strategy:
    rollingUpdate:
      maxUnavailable: 0   # never dip below capacity during a deploy
      maxSurge: 1
  template:
    metadata:
      labels:
        app: sentinel-x
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Must exceed the app's internal 10s shutdown deadline so SIGTERM
      # drain always finishes before the kubelet escalates to SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - name: sentinel-x
          image: ghcr.io/your-org/sentinel-x:1.0.0   # pin digests in CI, never :latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: info
            - name: DB_POOL_SIZE
              value: "10"
            # Queue transport for async ingestion. REQUIRED at replicas > 1:
            # without Redis each pod falls back to its own in-memory channel.
            - name: REDIS_URL
              value: redis://sentinel-x-redis:6379
            # In-process worker per pod. To split ingestion capacity from API
            # capacity, clone this Deployment as `sentinel-x-worker`, set
            # "false" here on the API pods and "true" (with no Service) on
            # the worker pods, and scale them independently.
            - name: INGEST_WORKER_ENABLED
              value: "true"
          envFrom:
            - secretRef:
                name: sentinel-x-secrets   # DATABASE_URL, JWT_SECRET, OAUTH_SERVER_URL, ...
          # Liveness restarts a wedged process; readiness gates traffic on the
          # DB being reachable. Keeping them separate endpoints is what stops
          # a database blip from becoming a fleet-wide restart storm.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi   # no CPU limit: throttling a latency-sensitive API hurts more than it protects
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-x
spec:
  selector:
    app: sentinel-x
  ports:
    - name: http
      port: 80
      targetPort: http
