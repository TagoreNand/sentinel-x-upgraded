version: '3.9'
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: sentinelx
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Queue transport for asynchronous ingestion. Without it the app falls
  # back to a single-node in-memory channel (fine for dev, not for prod).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      - db
      - redis
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://root:password@db:3306/sentinelx
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"

volumes:
  mysql_data:
